<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Flow Conduits Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowDashes {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes beacon {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 7px; opacity: 0.4; }
    }
    @keyframes stage1Highlight {
      0%, 20% { stroke: #38BDF8; stroke-width: 1.8; filter: drop-shadow(0 0 6px rgba(56,189,248,0.5)); }
      25%, 100% { stroke: #334155; stroke-width: 1; filter: none; }
    }
    @keyframes stage2Highlight {
      0%, 20% { stroke: #334155; stroke-width: 1; filter: none; }
      25%, 45% { stroke: #818CF8; stroke-width: 1.8; filter: drop-shadow(0 0 6px rgba(129,140,248,0.5)); }
      50%, 100% { stroke: #334155; stroke-width: 1; filter: none; }
    }
    @keyframes stage3Highlight {
      0%, 45% { stroke: #334155; stroke-width: 1; filter: none; }
      50%, 70% { stroke: #F59E0B; stroke-width: 1.8; filter: drop-shadow(0 0 6px rgba(245,158,11,0.5)); }
      75%, 100% { stroke: #334155; stroke-width: 1; filter: none; }
    }
    @keyframes stage4Highlight {
      0%, 70% { stroke: #334155; stroke-width: 1; filter: none; }
      75%, 95% { stroke: #10B981; stroke-width: 1.8; filter: drop-shadow(0 0 6px rgba(16,185,129,0.5)); }
      100% { stroke: #334155; stroke-width: 1; filter: none; }
    }
    .flow-line {
      stroke: url(#flowGrad);
      stroke-width: 2.5;
      stroke-dasharray: 6 6;
      animation: flowDashes 1.2s linear infinite;
    }
    .stage-card-1 { animation: stage1Highlight 6s ease-in-out infinite; }
    .stage-card-2 { animation: stage2Highlight 6s ease-in-out infinite; }
    .stage-card-3 { animation: stage3Highlight 6s ease-in-out infinite; }
    .stage-card-4 { animation: stage4Highlight 6s ease-in-out infinite; }
    .pulse-dot { animation: beacon 2s ease-in-out infinite; }
    .badge-pulse { animation: pulseGlow 2.5s ease-in-out infinite; }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="956" height="296" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top System Bar -->
  <g transform="translate(24, 22)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="30" height="30" rx="8" fill="url(#brandGrad)" />
    <path d="M7 11h16M7 15h11M7 19h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="21" cy="18" r="2.5" fill="#ffffff" />
    
    <!-- Title & Subtitle -->
    <text x="40" y="16" fill="#F8FAFC" font-size="14" font-weight="700" letter-spacing="0.5">TICKETFLOW ENTERPRISE</text>
    <text x="40" y="29" fill="#94A3B8" font-size="11" font-weight="500">Autonomous Support Lifecycle &amp; Role-Gated Pipeline</text>

    <!-- Live Status Pill -->
    <g transform="translate(775, 4)">
      <rect x="0" y="0" width="135" height="22" rx="11" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#34D399" class="pulse-dot" />
      <text x="25" y="15" fill="#34D399" font-size="10.5" font-weight="700" letter-spacing="0.5">PIPELINE ACTIVE</text>
    </g>
  </g>

  <!-- Connecting Conduits (Animated Streams Behind Cards) -->
  <path d="M225 170 L265 170" class="flow-line" />
  <path d="M465 170 L505 170" class="flow-line" />
  <path d="M705 170 L745 170" class="flow-line" />

  <!-- STAGE 1: INTAKE & CREATION -->
  <g transform="translate(25, 78)">
    <rect x="0" y="0" width="200" height="185" rx="12" fill="url(#cardGrad)" class="stage-card-1" />
    
    <!-- Step Header -->
    <circle cx="24" cy="24" r="12" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="28" fill="#38BDF8" font-size="11" font-weight="800">1</text>
    <text x="44" y="23" fill="#E2E8F0" font-size="12.5" font-weight="700">Customer Intake</text>
    <text x="44" y="36" fill="#64748B" font-size="10" font-weight="500">PORTAL DISPATCH</text>

    <!-- Card Body: Ticket Preview -->
    <rect x="14" y="52" width="172" height="118" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    
    <text x="24" y="74" fill="#94A3B8" font-size="9.5" font-weight="600">ACTION: POST /api/tickets</text>
    <text x="24" y="93" fill="#F1F5F9" font-size="11.5" font-weight="700">"Payment Gateway 504"</text>
    
    <!-- Status & Priority Chips -->
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8" />
      <text x="7" y="13" fill="#FCA5A5" font-size="9" font-weight="700">HIGH</text>

      <rect x="52" y="0" width="48" height="18" rx="4" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="0.8" />
      <text x="60" y="13" fill="#7DD3FC" font-size="9" font-weight="700">OPEN</text>
    </g>

    <text x="24" y="152" fill="#64748B" font-size="10">Author: customer@example.com</text>
  </g>

  <!-- STAGE 2: AUTH & RBAC SECURITY GATEWAY -->
  <g transform="translate(265, 78)">
    <rect x="0" y="0" width="200" height="185" rx="12" fill="url(#cardGrad)" class="stage-card-2" />
    
    <!-- Step Header -->
    <circle cx="24" cy="24" r="12" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="1" />
    <text x="20" y="28" fill="#818CF8" font-size="11" font-weight="800">2</text>
    <text x="44" y="23" fill="#E2E8F0" font-size="12.5" font-weight="700">Auth &amp; RBAC Guard</text>
    <text x="44" y="36" fill="#64748B" font-size="10" font-weight="500">EXPRESS GATEWAY</text>

    <!-- Card Body: Security Verification -->
    <rect x="14" y="52" width="172" height="118" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    
    <text x="24" y="74" fill="#94A3B8" font-size="9.5" font-weight="600">BEARER JWT VALIDATED</text>
    
    <g transform="translate(24, 88)">
      <path d="M0 6 L4 10 L12 2" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="18" y="8" fill="#E2E8F0" font-size="10" font-weight="600">Identity: id=1 Verified</text>
    </g>

    <g transform="translate(24, 110)">
      <path d="M0 6 L4 10 L12 2" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="18" y="8" fill="#E2E8F0" font-size="10" font-weight="600">Tenant Isolation OK</text>
    </g>

    <g transform="translate(24, 132)">
      <path d="M0 6 L4 10 L12 2" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="18" y="8" fill="#A5B4FC" font-size="10" font-weight="700">403 Shield Enforced</text>
    </g>

    <text x="24" y="156" fill="#64748B" font-size="9.5">Parameterized SQL (?) Safe</text>
  </g>

  <!-- STAGE 3: AGENT TRIAGE & KPI DISPATCH -->
  <g transform="translate(505, 78)">
    <rect x="0" y="0" width="200" height="185" rx="12" fill="url(#cardGrad)" class="stage-card-3" />
    
    <!-- Step Header -->
    <circle cx="24" cy="24" r="12" fill="#B45309" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1" />
    <text x="20" y="28" fill="#F59E0B" font-size="11" font-weight="800">3</text>
    <text x="44" y="23" fill="#E2E8F0" font-size="12.5" font-weight="700">Agent Triage Desk</text>
    <text x="44" y="36" fill="#64748B" font-size="10" font-weight="500">QUEUE &amp; KPI SYNC</text>

    <!-- Card Body: Assignment & State -->
    <rect x="14" y="52" width="172" height="118" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    
    <text x="24" y="74" fill="#94A3B8" font-size="9.5" font-weight="600">ACTION: PUT /api/tickets/:id</text>
    
    <g transform="translate(24, 88)">
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="0.8" />
      <text x="6" y="13" fill="#FDE68A" font-size="9" font-weight="700">IN PROGRESS</text>
    </g>

    <text x="24" y="125" fill="#E2E8F0" font-size="10.5" font-weight="600">Assignee: Bob Agent</text>
    
    <!-- KPI Counters Strip -->
    <g transform="translate(24, 140)">
      <rect x="0" y="0" width="144" height="18" rx="3" fill="#1E293B" />
      <text x="8" y="13" fill="#94A3B8" font-size="9">KPI: Open: 3</text>
      <text x="68" y="13" fill="#F59E0B" font-size="9">Active: 1</text>
      <text x="110" y="13" fill="#10B981" font-size="9">Done: 5</text>
    </g>
  </g>

  <!-- STAGE 4: THREADED RESOLUTION & CLOSED -->
  <g transform="translate(745, 78)">
    <rect x="0" y="0" width="190" height="185" rx="12" fill="url(#cardGrad)" class="stage-card-4" />
    
    <!-- Step Header -->
    <circle cx="24" cy="24" r="12" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
    <text x="20" y="28" fill="#10B981" font-size="11" font-weight="800">4</text>
    <text x="44" y="23" fill="#E2E8F0" font-size="12.5" font-weight="700">Resolution &amp; Close</text>
    <text x="44" y="36" fill="#64748B" font-size="10" font-weight="500">2-WAY THREAD STREAM</text>

    <!-- Card Body: Resolved State -->
    <rect x="14" y="52" width="162" height="118" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    
    <text x="24" y="74" fill="#94A3B8" font-size="9.5" font-weight="600">COMMUNICATION THREAD</text>
    
    <!-- Comment bubble snippet -->
    <g transform="translate(24, 84)">
      <rect x="0" y="0" width="142" height="24" rx="4" fill="#1E293B" />
      <text x="6" y="15" fill="#CBD5E1" font-size="9">"Payment webhook fixed."</text>
    </g>

    <!-- Closed Badge -->
    <g transform="translate(24, 118)">
      <rect x="0" y="0" width="56" height="20" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="0.8" />
      <text x="8" y="14" fill="#6EE7B7" font-size="9.5" font-weight="800">CLOSED</text>
    </g>

    <text x="24" y="156" fill="#34D399" font-size="10" font-weight="700">✓ SLA Resolved 200 OK</text>
  </g>
</svg>
